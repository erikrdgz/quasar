<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="A private-on-your-device salary, spending, and savings planner."><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./quasar-logo.png"><link rel="stylesheet" href="./style.css"><title>Quasar</title></head><body>
<header><a class="brand" href="./" aria-label="Quasar home"><img class="quasar-logo" src="./quasar-header.png" alt="">Quasar</a><button id="plansButton" class="plan-menu-button" aria-label="Saved plans and new plan" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="7" width="13" height="14" rx="3"/><path d="M15 3H6a3 3 0 0 0-3 3v11M10 12h5M10 16h3"/></svg></button></header>
<main><div class="layout"><div class="controls">
<section class="card income" id="income"><div class="section-head"><h2>Annual income</h2></div><label class="salary-label"><span class="sr-only">Annual salary</span><span>$</span><input id="salary" type="number" min="0" max="1000000" step="1000" inputmode="decimal"></label><input id="salarySlider" type="range" min="0" max="300000" step="1000" aria-label="Annual salary slider"><div class="range-labels"><span>$0</span><span>$300k</span></div></section>
<section class="card essentials" id="expenses-section"><div class="section-head"><h2>Monthly essentials</h2><span id="expenseTotal"></span></div><div id="expenses"></div><button id="addExpense" class="textbtn add">＋ Add expense</button></section>
<section class="card car-card" id="car-section"><div class="section-head"><h2>Car budget</h2><svg class="car-icon" viewBox="0 0 40 24" aria-hidden="true"><path d="m5 16 2-7 7-2h12l7 6 3 2v4H4v-3Zm5-7 3 6h18M12 19a3 3 0 1 0 0 .1M29 19a3 3 0 1 0 0 .1"/></svg></div><div class="car-value"><label class="money-input"><span>$</span><input id="car" type="number" min="0" max="10000" step="25" inputmode="decimal" aria-label="Monthly car budget"></label><span>/ month</span></div><input id="carSlider" type="range" min="0" max="2000" step="25" aria-label="Monthly car budget slider"><div class="range-labels"><span>$0</span><span>$2,000</span></div></section>
<section class="card goals-card" id="saving"><div class="section-head"><h2>Save up for</h2><button id="addGoal" class="textbtn">＋ Add goal</button></div><div id="goals"></div></section>
</div><aside id="overview"><section class="summary"><div class="summary-top"><input id="planName" aria-label="Plan name" maxlength="80"><span id="saveStatus" role="status">Saved on this device</span></div><p class="left-label" id="leftLabel">Left to spend each month</p><div class="hero-number" id="left">$0</div><p class="weekly" id="weekly"></p><div id="allocation" class="allocation" aria-label="Monthly take-home allocation"></div><div class="breakdown"><div class="takehome"><span>Monthly take-home</span><b id="net"></b></div><div><span><i class="key essential-key"></i>Essentials</span><b id="essentials"></b></div><div><span><i class="key car-key"></i>Car budget</span><b id="carOut"></b></div><div><span><i class="key savings-key"></i>Goal savings</span><b id="savings"></b></div></div><div id="budgetMessage" class="budget-message"></div><div class="annual"><span>Left over per year</span><strong id="annual"></strong></div></section><div class="backup-actions"><button id="exportButton" class="textbtn">Export plans ↓</button><button id="importButton" class="textbtn">Import plans ↑</button></div><input id="importFile" type="file" accept="application/json,.json" hidden></aside></div>
</main>
<dialog id="modal"><div class="modal-top"><h2 id="modalTitle"></h2><button id="closeModal" class="iconbtn" aria-label="Close dialog">×</button></div><div id="modalBody"></div></dialog><div id="toast" role="status"></div><script type="module" src="./app.js"></script></body></html>
