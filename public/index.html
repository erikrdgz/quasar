<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quasar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Quasar: compare salary plans, then track what's left to spend each month. Private to your device.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./quasar-logo.png">
<link rel="preload" href="./icon-512.png" as="image">
<link rel="stylesheet" href="./style.css?v=40">
<title>Quasar</title>
</head>
<body>
<div id="intro" class="intro" aria-live="polite"><div class="intro-step"><img class="intro-logo" src="./icon-512.png" alt="" width="168" height="168"></div></div>
<div id="app">
  <header class="top">
    <a class="brand" href="./" aria-label="Quasar home"><img src="./quasar-header.png" alt="" width="34" height="34">Quasar</a>
    <div class="top-actions">
      <span id="saveStatus" class="save-status" role="status"></span>
      <button id="menuButton" class="round-button" type="button" aria-label="Plans and backup" aria-haspopup="dialog"><span data-icon="plans"></span></button>
    </div>
  </header>
  <main>
    <section class="view" id="view-today" aria-labelledby="todayTitle">
      <div class="view-head"><h1 id="todayTitle">Today</h1><p id="todaySub"></p></div>
      <div class="bento" id="todayGrid"></div>
    </section>
    <section class="view" id="view-ledger" aria-labelledby="ledgerTitle" hidden>
      <div class="view-head"><h1 id="ledgerTitle">Ledger</h1><p id="ledgerSub"></p></div>
      <div id="ledgerContent"></div>
    </section>
    <section class="view" id="view-plans" aria-labelledby="plansTitle" hidden>
      <div class="view-head plans-head">
        <h1 id="plansTitle" class="sr-only">Plans</h1>
        <input id="planName" class="plan-name" aria-label="Plan name" maxlength="80" enterkeyhint="done">
        <button id="switchPlan" class="pill-button" type="button" aria-haspopup="dialog">All plans</button>
      </div>
      <div class="bento" id="plansGrid"></div>
    </section>
  </main>
</div>
<nav class="tabbar" aria-label="Sections">
  <span class="tab-pill" aria-hidden="true"></span>
  <button type="button" data-tab="today"><span data-icon="today"></span><span>Today</span></button>
  <button type="button" data-tab="ledger"><span data-icon="ledger"></span><span>Ledger</span></button>
  <button type="button" data-tab="plans"><span data-icon="compare"></span><span>Plans</span></button>
</nav>
<dialog id="modal"><div class="modal-top"><h2 id="modalTitle"></h2><button id="closeModal" class="round-button" type="button" aria-label="Close dialog"><span data-icon="close"></span></button></div><div id="modalBody"></div></dialog>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js?v=40"></script>
</body>
</html>
